[project]
name = "instructionx-uikit"
# 项目版本号统一为 alpha-v1.0.2（见 InstructionX_UIKit.__version__）；
# pyproject 受 PEP 440 限制，此处为其规范等价形式 1.0.2a1
version = "1.0.2a1"
description = "基于 PySide6 的纯桌面 UI 组件库：设计令牌双主题、58 组件、13 布局、52 动画、原生图表引擎与蓝图节点图"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    # numpy：图表引擎大规模数据管线（紧凑存储、向量化降采样与坐标映射、
    # 分层采样金字塔）。用户批准新增（见 AGENTS.md 依赖清单例外）。
    "numpy>=2.0",
    "pyside6>=6.11.1",
    "qrcode[pil]>=7.4",
]
